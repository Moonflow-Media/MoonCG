<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoonCG</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #14161a;
        color: #e6e8eb;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 20px;
      }
      #user {
        font-size: 13px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      h3 {
        margin: 0;
        padding: 8px 12px;
        font-size: 13px;
        background: #2a2e36;
      }
      a {
        color: #8ab4f8;
      }
      section {
        margin-bottom: 32px;
      }
      .state {
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: normal;
        background: #1f5132;
      }
      .failed .state {
        background: #7a2222;
      }
      .disabled .state {
        background: #4a4f5a;
      }
      .actions button {
        margin-left: 8px;
        font-size: 12px;
      }
      .errors {
        color: #ff9d9d;
      }
      .panels {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 12px;
      }
      .panel {
        border: 1px solid #2a2e36;
        border-radius: 6px;
        overflow: hidden;
      }
      .panel iframe {
        display: block;
        height: 240px;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MoonCG</h1>
      <span id="user"></span>
      <button id="logout" type="button">Sign out</button>
    </header>
    <p id="notice" class="errors" role="status"></p>
    <main id="bundles">Loading bundles...</main>
    <script type="module" src="/shell.js"></script>
  </body>
</html>
