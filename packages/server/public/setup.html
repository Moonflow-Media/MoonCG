<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Setup - MoonCG</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <section class="card">
      <div class="brand">
        <img src="/logo-mark.svg" alt="" width="32" height="32" />
        <h1>MoonCG setup</h1>
      </div>
      <p class="intro">
        Create the first administrator. The setup code is in the server's start-up output.
      </p>
      <form id="form" data-action="/api/v1/setup" data-then="/login">
        <label>Setup code <input name="code" autocomplete="off" required /></label>
        <label>User name <input name="username" autocomplete="username" required /></label>
        <label>
          Password (at least 8 characters)
          <input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </label>
        <button type="submit">Create administrator</button>
        <p id="notice" class="errors" role="alert"></p>
      </form>
    </section>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
